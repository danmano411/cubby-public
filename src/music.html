<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Cubby music</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* Collapsed: a 64px column under the socials strip. Expanded (music key / hover): the song
       panel slides out to the left. The window is full expanded width; empty space is click-through. */
    body { height: 100vh; display: flex; justify-content: flex-end; align-items: flex-start; }
    #card { display: flex; margin: 0 2px 0 0; background: rgb(22, 22, 28); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
    .info { width: 0; opacity: 0; transition: width 0.22s ease, opacity 0.18s ease; display: flex; flex-direction: column; justify-content: center; cursor: pointer; }
    .open .info { width: 210px; opacity: 1; }
    .info > div { width: 210px; padding: 0 4px 0 16px; }
    .name { font-weight: 700; font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .sub { color: var(--muted); font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .keys { color: var(--faint); font-size: 10.5px; margin-top: 10px; }
    .col { width: 62px; padding: 11px 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .col .icon { width: 34px; height: 34px; margin-bottom: 4px; cursor: pointer; }
    .off .icon { filter: grayscale(1); opacity: 0.4; }
    .col button { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 12px; }
    .col button:hover { border-color: var(--accent); }
    .col .play { background: var(--accent-soft); border-color: rgba(166, 177, 225, 0.45); color: var(--accent); }
  </style>
</head>
<body>
  <div id="card">
    <div class="info" id="info"><div><div class="name" id="song"></div><div class="sub" id="artist"></div><div class="keys" id="keys"></div></div></div>
    <div class="col" id="col"></div>
  </div>
  <script src="ui.js"></script>
  <script src="music.js"></script>
</body>
</html>
