<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Cubby listening</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { height: 100vh; display: grid; place-items: center; }
    #cue { width: 220px; padding: 26px 0 20px; display: flex; flex-direction: column; align-items: center; gap: 16px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 26px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      animation: in 0.16s ease-out; }
    @keyframes in { from { opacity: 0; transform: scale(0.94); } }
    .mark { position: relative; width: 84px; height: 84px; }
    .logo { position: absolute; inset: 0; border-radius: 22px; background:
      linear-gradient(var(--on-accent) 0 0) 16px 16px / 22px 22px no-repeat, linear-gradient(var(--on-accent) 0 0) 46px 16px / 22px 22px no-repeat,
      linear-gradient(var(--on-accent) 0 0) 16px 46px / 22px 22px no-repeat, linear-gradient(var(--on-accent) 0 0) 46px 46px / 22px 22px no-repeat, var(--accent); }
    .ring { position: absolute; inset: -6px; border-radius: 28px; border: 2px solid var(--accent); opacity: 0; }
    .listening .ring { animation: pulse 1.4s ease-out infinite; }
    .listening .ring + .ring { animation-delay: 0.7s; }
    @keyframes pulse { from { opacity: 0.7; transform: scale(1); } to { opacity: 0; transform: scale(1.35); } }
    .title { font-weight: 700; font-size: 15px; }
    .sub { color: var(--muted); font-size: 12px; margin-top: -10px; }
    .heard .logo { background-color: var(--live); }
    .heard.danger .logo { background-color: var(--danger); }
  </style>
</head>
<body>
  <div id="cue">
    <div class="mark"><div class="ring"></div><div class="ring"></div><div class="logo"></div></div>
    <div class="title" id="title">Listening…</div>
    <div class="sub" id="sub"></div>
  </div>
  <script src="listen.js"></script>
</body>
</html>
