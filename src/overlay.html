<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <title>Cubby</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="backdrop"></div>
  <main id="panel">
    <header>
      <div class="brand"><span class="logo"></span>Cubby</div>
      <input id="filter" placeholder="Type to jump…" spellcheck="false" autocomplete="off">
      <div class="session">
        <button id="open-all"><span class="ico">▶</span>Open all</button>
        <button id="close-all"><span class="ico">✕</span><span class="label">Close all</span></button>
      </div>
      <div class="modes" id="modes">
        <span class="modes-label">Socials</span>
        <button data-mode="dnd" title="Minimize socials, collect pings silently">DND</button>
        <button data-mode="ping" title="Small toast when a social app wants you">Ping Me</button>
      </div>
      <div class="modes" id="panels">
        <span class="modes-label">Side</span>
        <button id="side" title="What shows on the right edge">Off</button>
      </div>
      <div class="modes">
        <span class="modes-label">Voice</span>
        <button id="voice" title="Listen for voice commands (beta)">Listen</button>
      </div>
      <button id="settings" title="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>
    <section id="groups"></section>
    <footer>
      <div id="music"></div>
      <div id="event" hidden></div>
      <div class="hints" id="hints"></div>
    </footer>
  </main>
  <script src="ui.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
